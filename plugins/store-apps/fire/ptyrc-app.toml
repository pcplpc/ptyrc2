[app]
id = "fire"
version = "0.2.0"
summary = "A fire in a quiet room of the screen, from a candle to a hearth."
license = "GPL-3.0-or-later"
api = 1
script = "app.js"
surface = "widget"
frame = "raw"
random = [[], ["-a"]]

# It reads nothing: the driver places the widget. Hover on its own
# widget, the default profile, pokes the fire.

[options]
blocks = { type = "bool", default = false, short = "b", doc = "half blocks" }
logs = { type = "bool", default = false, short = "l", doc = "a candle, a brazier, logs, a mantel" }
cycle = { type = "bool", default = false, short = "c", doc = "it burns down, a log is put on" }
sparks = { type = "bool", default = false, short = "k", doc = "sparks rise" }
glow = { type = "bool", default = false, short = "g", doc = "the light of the fire" }
all = { type = "bool", default = false, short = "a", doc = "-b -l -c -k -g" }
burn = { type = "float", default = 3600.0, doc = "with -c: seconds from a log to the next, more than 0" }
