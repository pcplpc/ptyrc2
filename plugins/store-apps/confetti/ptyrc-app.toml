[app]
id = "confetti"
version = "0.2.0"
summary = "Pops of confetti, behind the text, where it does not change."
license = "GPL-3.0-or-later"
api = 1
script = "app.js"
surface = "frame"
random = [[], ["-a"]]

[permissions]
shape = "aims where the text does not change (the heat of the frame)"

[options]
bursts = { type = "int", default = 1, min = 1, max = 10, doc = "bursts at once" }
one-shot = { type = "bool", default = false, doc = "one round, then exit" }
sparkle = { type = "bool", default = false, doc = "twinkles in the back" }
fancy = { type = "bool", default = false, doc = "big animated explosions" }
random = { type = "bool", default = false, doc = "of every size and shape" }
fireworks = { type = "bool", default = false, doc = "a rocket before each" }
all = { type = "bool", default = false, short = "a", doc = "fancy, random, fireworks, sparkle" }
size = { type = "int", default = 64, doc = "pieces per explosion" }
duration = { type = "float", default = 3.0, doc = "seconds per explosion" }
