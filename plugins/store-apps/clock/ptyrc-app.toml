[app]
id = "clock"
version = "0.2.0"
summary = "A clock in a quiet room of the screen, from HH:MM to a dial."
license = "GPL-3.0-or-later"
api = 1
script = "app.js"
surface = "widget"
frame = "raw"

[permissions]
clock = "the time of day, in its zone; without it, the time since the start"

[options]
utc = { type = "bool", default = false, doc = "UTC time" }
tz = { type = "string", doc = "time zone, as Europe/Paris" }
seconds = { type = "bool", default = true, doc = "faces with seconds; --no-seconds: without" }
big = { type = "bool", default = false, doc = "block digits only" }
