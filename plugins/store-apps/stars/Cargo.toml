[package]
name = "stars"
description = "A night sky behind the text, a moon that crosses it, grass in a breeze."
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

# For cargo (`cargo test`, an editor). The store builds src/lib.rs with
# rustc alone and its own copy of ptyrc-app.
[dependencies]
ptyrc-app = { path = "../../../sdk/rust/ptyrc-app" }
