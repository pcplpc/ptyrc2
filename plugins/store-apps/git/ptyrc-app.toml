# SPDX-License-Identifier: GPL-3.0-or-later
[app]
id = "git"
version = "0.1.0"
summary = "A repository in widgets: head, status, log, pulse."
license = "GPL-3.0-or-later"
api = 1
script = "app.js"
surface = "widget"
frame = "raw"
random = [[], ["-a"]]

[permissions]
probe-git = "the state of the repository, read by the driver (runs git, never writes)"
clock = "the date of a commit under the pointer, in the local zone"
files = "the repository named (--repo)"

[options]
status = { type = "bool", default = false, short = "t", doc = "and the tag status" }
log = { type = "bool", default = false, short = "l", doc = "and the tag log" }
branches = { type = "bool", default = false, short = "b", doc = "and the tag branches" }
stash = { type = "bool", default = false, short = "S", doc = "and the tag stash" }
worktrees = { type = "bool", default = false, short = "w", doc = "and the tag worktrees" }
pulse = { type = "bool", default = false, short = "p", doc = "and the tag pulse" }
graph = { type = "bool", default = false, short = "g", doc = "the log as a graph, with the refs" }
warn = { type = "bool", default = false, short = "W", doc = "a chase on the border of a warning" }
all = { type = "bool", default = false, short = "a", doc = "all of the above" }
monitor = { type = "string", doc = "the tags, comma-separated, of head,status,log,branches,stash,worktrees,pulse; shown even with nothing to tell" }
merged = { type = "bool", default = false, doc = "one widget, the tags in turn" }
repo = { type = "dir", doc = "a path in the repository [default: the program's directory]" }
every = { type = "float", default = 5.0, doc = "read again, when nothing told of a change, seconds [default: 5]" }
cycle = { type = "float", default = 8.0, doc = "turn of --merged, seconds [default: 8]" }
dirty = { type = "float", default = 4.0, doc = "-W: a tree changed for that long is a warning, hours [default: 4]" }
