# SPDX-License-Identifier: GPL-3.0-or-later
[app]
id = "pond"
version = "0.1.0"
summary = "Still water behind the text, rings that break against the words."
license = "GPL-3.0-or-later"
api = 1
rust = "src/lib.rs"
rustc = "1.88"
surface = "frame"
frame = "largest"
random = [[], ["-a"]]

[permissions]
shape = "where the text is: the rings break against it, the koi swim around it"
pointer = "the koi and the insects flee the pointer; without it they never take fright"
clock = "the moon's phase and the season of today; without it, those of the start of 1970"

[options]
pads = { type = "float", default = 6.0, min = 0.0, doc = "lily pads over 80 by 24 cells" }
drops = { type = "float", default = 10.0, min = 0.0, doc = "drops a minute over 80 by 24 cells" }
current = { type = "float", default = 0.6, min = 0.0, doc = "the current, dots a second; 0: still water" }
night = { type = "float", default = 300.0, doc = "seconds the moon takes to cross the pond, with -m; more than 0" }
phase = { type = "float", doc = "phase of the moon: 0 new, 0.25 first quarter, 0.5 full; none: tonight's" }
season = { type = "string", choices = ["spring", "summer", "autumn", "winter"], doc = "what floats by, with -p; none: today's" }
koi = { type = "bool", short = "k", doc = "koi under the surface" }
lotus = { type = "bool", short = "l", doc = "lotus in bloom on the pads" }
rain = { type = "bool", short = "r", doc = "showers that come and go" }
moon = { type = "bool", short = "m", doc = "the moon in the water" }
petals = { type = "bool", short = "p", doc = "what the season sheds, adrift: petals, leaves" }
insects = { type = "bool", short = "i", doc = "water striders, dragonflies" }
all = { type = "bool", short = "a", doc = "-k -l -r -m -p -i" }
