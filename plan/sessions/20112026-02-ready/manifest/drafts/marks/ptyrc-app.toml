[app]
id = "marks"
version = "0.1.0"
summary = "Highlights a selected pattern."
license = "GPL-3.0-or-later"
api = 1
script = "app.js"
surface = "frame"
random = []

[permissions]
shape = "when the text changes, to find the patterns again"
front = "the matches tinted over the text; the counts"

[options]
regex = { type = "pattern", list = true, regex = true, short = "e", doc = "a regular expression to mark; may be repeated" }
ignore-case = { type = "bool", default = false, short = "i", doc = "ignore-case" }
hud = { type = "bool", default = true, doc = "no display of the counts" }

[args]
patterns = { type = "pattern", min = 0, max = 16, doc = "text to mark" }
