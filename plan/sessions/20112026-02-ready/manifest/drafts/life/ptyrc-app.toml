[app]
id = "life"
version = "0.1.0"
summary = "Game of life in braille behind the text."
license = "GPL-3.0-or-later"
api = 1
rust = "src/lib.rs"
rustc = "1.85"
surface = "frame"
frame = "largest"
random = [[], ["-a"]]

[permissions]
shape = "where the text is: no cell lives on it"
pointer = "the pointer clears the cells near it"

[options]
speed = { type = "float", default = 10.0, doc = "generations per second [default: 10]" }
colour = { type = "bool", default = false, short = "c", doc = "a glyph coloured by its age" }
trail = { type = "bool", default = false, short = "t", doc = "the cells that died fade out" }
guests = { type = "bool", default = false, short = "g", doc = "patterns dropped in, where the world is empty first" }
rate = { type = "float", default = 3.0, doc = "with -g: patterns a second into an empty world, 4 times fewer into a crowded one; 0: only when it is still [default: 3]" }
kinds = { type = "string", doc = "with -g: the kinds dropped, of ship, seed, oscillator, puffer, gun, still, filler; or all [default: ship,seed,oscillator,puffer,gun,still,filler]" }
particles = { type = "bool", default = false, short = "p", doc = "particles where cells die together and where a pattern lands" }
walls = { type = "bool", default = false, short = "w", doc = "no cell lives under the text" }
cursor = { type = "bool", default = false, needs = ["pointer"], doc = "the pointer of the host, moved over the pane, clears the cells near it" }
all = { type = "bool", default = false, short = "a", needs = ["pointer"], doc = "-c -t -g -p -w --cursor" }
