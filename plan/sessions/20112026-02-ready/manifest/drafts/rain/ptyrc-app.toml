[app]
id = "rain"
version = "0.1.0"
summary = "Quiet rain behind the text."
license = "GPL-3.0-or-later"
api = 1
script = "app.js"
surface = "frame"
frame = "raw"

[permissions]
layout = "the frame it falls in"

[options]
rate = { type = "float", default = 20.0, doc = "drops per second over 80 columns [default: 20]" }
transparent = { type = "bool", default = false, short = "t", doc = "the drops fall through the text and the cursor, down to the bottom of the pane" }
