[app]
id = "stars"
version = "0.1.0"
summary = "Night sky, a moon and grass in a breeze."
license = "GPL-3.0-or-later"
api = 1
rust = "src/lib.rs"
rustc = "1.85"
surface = "frame"
frame = "largest"
random = [[], ["-a"]]

[permissions]
shape = "where the text is: the sky is around it"
pointer = "the stars under the pointer"
clock = "the phase of the moon"

[options]
stars = { type = "float", default = 70.0, doc = "stars over 80 by 24 cells [default: 70]" }
night = { type = "float", default = 300.0, doc = "the time the moon takes to cross the sky [default: 300]" }
moon = { type = "float", default = 5.0, doc = "radius of the moon, 2 dots a column; 0: no moon [default: 5]" }
phase = { type = "float", doc = "phase of the moon: 0 new, 0.25 first quarter, 0.5 full [default: tonight's]" }
wind = { type = "float", default = 1.0, doc = "strength of the breeze, < 0 to the left; 0: none [default: 1]" }
twinkle = { type = "bool", default = false, short = "t", doc = "the stars twinkle" }
turn = { type = "bool", default = false, short = "r", doc = "the sky turns, slower than the moon" }
constellations = { type = "bool", default = false, short = "c", doc = "three constellations, their lines drawn" }
galaxy = { type = "bool", default = false, short = "g", doc = "the milky way, a band of dust" }
meteors = { type = "bool", default = false, short = "m", doc = "a shooting star now and then" }
bugs = { type = "bool", default = false, short = "b", doc = "fireflies over the grass" }
wild = { type = "bool", default = false, short = "w", doc = "a meadow: taller grass, flowers" }
all = { type = "bool", default = false, short = "a", doc = "-t -r -c -g -m -b -w" }
grass = { type = "bool", default = true, doc = "the sky only: no grass, and none of -b -w" }
