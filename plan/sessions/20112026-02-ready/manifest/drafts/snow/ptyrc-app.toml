[app]
id = "snow"
version = "0.1.0"
summary = "Snow on the lines of text."
license = "GPL-3.0-or-later"
api = 1
script = "app.js"
surface = "frame"
frame = "raw"

[permissions]
layout = "the frame it falls in"
pointer = "the pointer takes the snow it is over"

[options]
rate = { type = "float", default = 14.0, doc = "flakes per second over 80 columns [default: 14]" }
cover = { type = "bool", default = false, doc = "the snow lies on the text and the floor; else it only falls" }
wind = { type = "float", default = -1.0, doc = "drift, columns per second, < 0 to the left; it gusts; 0: none [default: -1]" }
max-depth = { type = "int", doc = "with --cover: rows a pile of snow holds; 0: no limit [default: 3; 0 with --all]" }
hover = { type = "bool", default = false, needs = ["pointer"], doc = "the host mouse takes the snow it is over, and what falls there" }
all = { type = "bool", default = false, short = "a", needs = ["pointer"], doc = "--cover and --hover; --max-depth is 0 unless given" }
