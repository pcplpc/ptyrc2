# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "ptyrc-js"
description = "ptyrc: the script interpreter, a guest of ABI 1"
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
boa_engine = { version = "0.22", default-features = false }
getrandom = "0.4"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
