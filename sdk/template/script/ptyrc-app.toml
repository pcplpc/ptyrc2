[app]
id = "{{id}}"
version = "0.1.0"
summary = "A clock in the top right corner."
license = "GPL-3.0-or-later"
api = 1
script = "app.js"
surface = "screen"

[options]
label = { type = "string", default = "t", doc = "shown before the time" }

# The format, every permission and limit: PROTOCOL.md.
# [permissions]
# shape = "why, in one line"
# words = { list = ["food", "fish"], why = "why, in one line" }
# [limits]
# memory-mib = 128
