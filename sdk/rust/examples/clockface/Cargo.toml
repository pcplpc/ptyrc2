[package]
name = "clockface"
description = "A stopwatch in a widget: block digits where there is room, a line where not."
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
ptyrc-app = { path = "../../ptyrc-app" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
