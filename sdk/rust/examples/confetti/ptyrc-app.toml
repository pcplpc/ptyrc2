# SPDX-License-Identifier: GPL-3.0-or-later
[app]
id = "confetti"
version = "0.1.0"
summary = "Small pops of colour, as in the first ptyrc."
license = "GPL-3.0-or-later"
api = 1
rust = "src/lib.rs"
rustc = "1.85"
surface = "screen"

[options]
bursts = { type = "int", default = 1, min = 1, max = 10, doc = "bursts a round" }
one-shot = { type = "bool", default = false, doc = "one round, then exit" }
