[workspace]
resolver = "3"
members = ["rust/*", "plugins/tui-support/*", "plugins/draw-ext/*"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://gitlab.com/plcp/ptyrc"

[workspace.dependencies]
ptyrc-vt = { path = "rust/ptyrc-vt" }
ptyrc-core = { path = "rust/ptyrc-core" }
ptyrc-proto = { path = "rust/ptyrc-proto" }
ptyrc-server = { path = "rust/ptyrc-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol_str = "0.3"
regex = "1"

[profile.release]
opt-level = 3
lto = "thin"
