[package]
name = "ptyrc-cli"
description = "ptyrc: the pty remote controller"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ptyrc"
path = "src/main.rs"

[dependencies]
ptyrc-server.workspace = true
ptyrc-proto.workspace = true
ptyrc-core.workspace = true
ptyrc-vt.workspace = true
serde_json.workspace = true
ptyrc-tui-vim = { path = "../../plugins/tui-support/vim" }
ptyrc-tui-tmux = { path = "../../plugins/tui-support/tmux" }
ptyrc-tui-ranger = { path = "../../plugins/tui-support/ranger" }
ptyrc-tui-htop = { path = "../../plugins/tui-support/htop" }
ptyrc-tui-agent = { path = "../../plugins/tui-support/agent-tui" }
ptyrc-draw-shapes = { path = "../../plugins/draw-ext/shapes" }
ptyrc-draw-bigtext = { path = "../../plugins/draw-ext/bigtext" }
ptyrc-draw-rain = { path = "../../plugins/draw-ext/rain" }
ptyrc-draw-sand = { path = "../../plugins/draw-ext/sand" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
rustix = { version = "1", features = ["termios"] }
