[package]
name = "ptyrc-box"
description = "ptyrc: the runner of store apps (WebAssembly, ABI 1)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ptyrc-box"
path = "src/main.rs"

[dependencies]
ptyrc-core.workspace = true
ptyrc-draw-bigtext = { path = "../../plugins/draw-ext/bigtext" }
ptyrc-draw-borders = { path = "../../plugins/draw-ext/borders" }
ptyrc-draw-rain = { path = "../../plugins/draw-ext/rain" }
ptyrc-draw-sand = { path = "../../plugins/draw-ext/sand" }
ptyrc-draw-shapes = { path = "../../plugins/draw-ext/shapes" }
ptyrc-draw-snow = { path = "../../plugins/draw-ext/snow" }
ptyrc-proto.workspace = true
ptyrc-vt.workspace = true
serde_json.workspace = true
signal-hook = "0.4"
wasmtime = { version = "49", default-features = false, features = ["cranelift", "parallel-compilation", "runtime", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
libc = "0.2"
seccompiler = "0.5"

[dev-dependencies]
wat = "1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { version = "0.31", features = ["process", "ptrace", "signal", "uio"] }
